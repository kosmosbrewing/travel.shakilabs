      {
        "@context": "https://schema.org",

    <script>
      (() => {
        try {
          const key = "travel-tools:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>
    <style>
      /* 브랜드 hue — DESIGN_CLEANUP_PLAN_2026-09-17.md §2.2 "사업·여행"(주황) 그룹으로 통일.
         기존 호박(hue 38)은 사업 주황(hue 25/24)과 13° 차이뿐이라 "비슷한데 다름"만
         남기고 구분 신호가 되지 못했다 — seller와 같은 값으로 합친다(재계산 금지, 확정표 그대로).
         의미색(status-success/warning/danger/info)은 main.css로 옮겨 v3 고정 hex를 쓴다 —
         과거 이 자리에 있던 --profit/--fee 리터럴은 폐기(§2.2 "로컬 별칭은 매핑하고 정의 삭제"). */
      :root {
        /* v3 §2.1 역할 토큰 — canvas/card/ink/ink-muted/line/focus는 hex에서 역산(반올림 왕복 검증 완료). */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 210 40% 96%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        --primary: 25 85% 27%;
        --primary-foreground: 0 0% 100%;
        --secondary: 25 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 25 83% 95%;
        --accent-foreground: 25 85% 30%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* v3 §4.1 카테고리 액센트 API — @shakilabs/ui 0.3.15가 읽는 계약: --accent-hsl / --accent-muted-hsl.
           브랜드색은 지우지 않고 그대로 주입 — SecondaryNav underline·ResultAmount 전용.
           --primary와 항상 같은 값으로 유지한다(따로 갱신 잊으면 내비 밑줄만 옛 색으로 남는다). */
        --accent-hsl: 25 85% 27%;
        --accent-muted-hsl: 25 85% 27%;
        --destructive: 0 74% 42%;
        --destructive-foreground: 210 40% 98%;
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 214 16% 85%;
        --ring: 0 0% 3.92%; /* color.focus #0A0A0A (v3 §2.1 — 포커스는 브랜드색이 아니라 ink) */
        --radius: 0.4rem;
      }

      .dark {
        --background: 0 0% 7.06%; /* color.canvas dark #121212 */
        --foreground: 0 0% 96.08%; /* color.ink dark #F5F5F5 */
        --muted: 217 33% 17%;
        --muted-foreground: 60 3.33% 64.71%; /* color.ink-muted dark #A8A8A2 */
        --card: 0 0% 10.98%; /* color.card dark #1C1C1C */
        --card-foreground: 0 0% 96.08%;
        --primary: 24 82% 56%;
        --primary-foreground: 24 82% 10%;
        --secondary: 24 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 24 62% 22%;
        --accent-foreground: 24 82% 78%;
        --popover: 0 0% 10.98%;
        --popover-foreground: 0 0% 96.08%;
        --accent-hsl: 24 82% 56%;
        --accent-muted-hsl: 24 82% 56%;
        --destructive: 0 75% 72%;
        --destructive-foreground: 0 60% 10%;
        --border: 0 0% 16.47%; /* color.line dark #2A2A2A */
        --input: 214 16% 30%;
        --ring: 0 0% 96.08%; /* color.focus dark #F5F5F5 */
      }

      html {
        font-size: 16px;
        /* v3 §3.1 BL-061 — 앵커·H2가 고정 헤더/2차 내비에 가리지 않게 스크롤 오프셋 확보 */
        --header-h: 56px;
        --secondary-nav-h: 49px;
        scroll-padding-top: calc(var(--header-h) + var(--secondary-nav-h, 0px) + 8px);
      }

      /* 0.3.38 — <48rem에서는 탭 줄이 ☰로 접혀 고정 층이 헤더 하나뿐이다. 앵커 오프셋에서도 뺀다. */
      @media (max-width: 47.99rem) {
        html { --secondary-nav-h: 0px; }
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
    </style>
